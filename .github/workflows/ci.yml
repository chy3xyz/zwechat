name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION="0.17.0-dev.1567+f0354179a"
          case "$RUNNER_OS" in
            Linux)   PLAT="x86_64-linux";  EXT="tar.xz" ;;
            macOS)   PLAT="aarch64-macos"; EXT="tar.xz" ;;
            *) echo "unsupported runner os: $RUNNER_OS"; exit 1 ;;
          esac
          FILE="zig-${PLAT}-${ZIG_VERSION}.${EXT}"
          curl -fL --retry 3 --retry-delay 2 -o "$FILE" "https://ziglang.org/builds/$FILE"
          mkdir -p "$HOME/zig"
          tar -xf "$FILE" -C "$HOME/zig" --strip-components=1
          "$HOME/zig/zig" version
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon', 'build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 pkg-config

      - name: Check Formatting
        run: zig build fmt

      - name: Run Unit Tests
        run: zig build test

      - name: Build Library, CLI & Examples
        run: zig build

  test-windows:
    name: Build & Test (windows-latest, GNU ABI)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION="0.17.0-dev.1567+f0354179a"
          PLAT="x86_64-windows"
          FILE="zig-${PLAT}-${ZIG_VERSION}.zip"
          curl -fL --retry 3 --retry-delay 2 -o "$FILE" "https://ziglang.org/builds/$FILE"
          python -m zipfile -e "$FILE" "$HOME"
          mv "$HOME/zig-${PLAT}-${ZIG_VERSION}" "$HOME/zig"
          "$HOME/zig/zig.exe" version
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Setup MSYS2 + OpenSSL
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-openssl

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\zig
            .zig-cache
          key: windows-zig-${{ hashFiles('build.zig.zon', 'build.zig') }}
          restore-keys: |
            windows-zig-

      - name: Check Formatting
        run: |
          # msys2 默认 locale 可能非 UTF-8，导致 zig fmt 解析中文注释失败
          export LC_ALL=C.UTF-8
          zig build fmt

      - name: Run Unit Tests
        run: |
          # cygpath -w 把 MSYS 挂载点（/mingw64）转为原生 Win32 路径，
          # 否则原生 zig.exe 会把 /mingw64/include 解析成盘符根。
          export OPENSSL_DIR="$(cygpath -w "$MINGW_PREFIX")"
          zig build -Dtarget=x86_64-windows-gnu test

      - name: Build Library, CLI & Examples
        run: |
          export OPENSSL_DIR="$(cygpath -w "$MINGW_PREFIX")"
          zig build -Dtarget=x86_64-windows-gnu
